<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>像素画编辑器 — Slime Designer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1e1e1e;
  color: #ddd;
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}

.app {
  display: flex;
  gap: 16px;
  padding: 12px;
  max-width: 900px;
  width: 100%;
  align-items: flex-start;
}

/* ====== 左侧：画布 ====== */
.canvas-wrap {
  flex-shrink: 0;
  background: #2a2a2a;
  border: 2px solid #444;
  border-radius: 6px;
  padding: 4px;
}

canvas {
  display: block;
  image-rendering: pixelated;
  cursor: crosshair;
}

/* 手机笔触浮点 */
.pen-dot {
  display: none;
  position: fixed;
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.9);
  background: rgba(255,255,255,0.3);
  pointer-events: none;
  z-index: 999;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px rgba(0,0,0,0.4);
}

/* ====== 右侧：面板 ====== */
.panel {
  flex: 1;
  min-width: 200px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.current-box {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  background: #2a2a2a;
  border-radius: 6px;
}

.swatch {
  width: 44px; height: 44px;
  border-radius: 4px;
  border: 2px solid #888;
  flex-shrink: 0;
}

.hex { font-family: Consolas, monospace; font-size: 15px; color: #ccc; }

/* 色板 */
.palette { display: flex; flex-direction: column; gap: 3px; }

.color-row {
  display: flex;
  gap: 3px;
  align-items: center;
}

.color-row .label {
  width: 28px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
}

.color-cell {
  width: 28px; height: 22px;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid #555;
  flex-shrink: 0;
  transition: transform 0.1s;
}

.color-cell:hover { transform: scale(1.25); z-index: 2; }
.color-cell.active { border: 2px solid #fff; transform: scale(1.2); z-index: 3; }

/* 按钮 */
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  padding: 8px 14px; border: none; border-radius: 4px;
  font-size: 13px; font-weight: bold; cursor: pointer;
  color: #fff;
}
.btn-clear  { background: #555; }
.btn-export { background: #4CAF50; }
.btn-undo   { background: #777; }
.btn-erase  { background: #c0392b; }

.btn:active { opacity: 0.7; }

.tip {
  font-size: 11px; color: #888;
  line-height: 1.6;
}

/* 导出弹窗 */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  justify-content: center; align-items: center;
}
.modal-overlay.show { display: flex; }

.modal {
  background: #2a2a2a;
  border: 2px solid #555;
  border-radius: 8px;
  padding: 16px;
  max-width: 500px; width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}

.modal h3 { margin-bottom: 8px; font-size: 16px; }

.modal pre {
  background: #1a1a1a; color: #8f8;
  padding: 10px; border-radius: 4px;
  font-size: 11px; overflow-x: auto;
  white-space: pre-wrap;
  max-height: 300px;
  overflow-y: auto;
}

.modal .info { font-size: 12px; color: #aaa; margin: 8px 0; }

/* ====== 响应式：手机竖排 ====== */
@media (max-width: 680px) {
  .app { flex-direction: column; align-items: center; gap: 10px; }
  .panel { width: 100%; }
  .color-cell { width: 24px; height: 18px; }
  .color-row .label { width: 22px; font-size: 11px; }
}
</style>
</head>
<body>

<div class="pen-dot" id="penDot"></div>

<div class="app">
  <!-- 画布 -->
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <!-- 面板 -->
  <div class="panel">
    <div class="current-box">
      <div class="swatch" id="swatch"></div>
      <span class="hex" id="hexLabel">#52c852</span>
      <label style="display:flex;align-items:center;gap:4px;margin-left:auto;cursor:pointer;color:#ccc;font-size:12px;">
        🎨取色
        <input type="color" id="customColor" value="#52c852"
               style="width:40px;height:40px;border:none;border-radius:6px;cursor:pointer;"
               onchange="pickCustom(this.value)">
      </label>
    </div>

    <div class="palette" id="palette"></div>

    <div style="font-size:11px;color:#aaa;margin-top:4px;">▼ 现有皮肤预览（点击加载）</div>
    <div id="skinGallery" style="display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow-y:auto;"></div>

    <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#aaa;">
      画布大小:
      <input type="range" id="gridSize" min="10" max="30" value="20"
             style="flex:1;accent-color:#4CAF50;"
             oninput="resizeGrid(this.value)">
      <span id="gridSizeLabel">20×20</span>
    </div>

    <div class="btns">
      <button class="btn btn-erase" onclick="setEraser()">🧹 橡皮</button>
      <button class="btn btn-undo" onclick="undo()">↩ 撤销</button>
      <button class="btn btn-clear" onclick="clearAll()">清空</button>
      <button class="btn btn-export" onclick="exportCode()">★ 导出</button>
      <button class="btn" onclick="showImport()" style="background:#FF9800;">📥 导入</button>
    </div>

    <div class="tip">
      🖱 左键/手指 = 画 &nbsp;|&nbsp; 右键/长按 = 擦除<br>
      📱 双指缩放可调画布大小 &nbsp;|&nbsp; 🎯 笔触跟随
    </div>
  </div>
</div>

<!-- 导入弹窗 -->
<div class="modal-overlay" id="importOverlay" onclick="closeImport(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>📥 导入代码</h3>
    <p class="info">把导出的 PALETTE + SLIME_PX 代码粘贴进来</p>
    <textarea id="importCode" style="width:100%;height:180px;background:#1a1a1a;color:#8f8;border:1px solid#555;border-radius:4px;padding:8px;font-family:Consolas;font-size:11px;resize:vertical;" placeholder="PALETTE = { ... }&#10;&#10;SLIME_PX = [ ... ]"></textarea>
    <div style="margin-top:10px;">
      <button class="btn btn-export" onclick="doImport()">导入</button>
      <button class="btn btn-clear" onclick="closeImport()" style="margin-left:8px;">取消</button>
    </div>
  </div>
</div>

<!-- 导出弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>导出成功 ✅</h3>
    <p class="info" id="exportInfo"></p>
    <pre id="exportCode"></pre>
    <button class="btn btn-export" onclick="copyCode()">📋 复制代码</button>
    <button class="btn btn-clear" onclick="closeModal()" style="margin-left:8px;">关闭</button>
  </div>
</div>

<script>
// ===================== 配置 =====================
let GRID_W = 20, GRID_H = 20;
let CELL_SIZE = isMobile() ? 16 : 22;

const COLOR_FAMILIES = [
  { name: '🟢绿', hexes: ['#d4f5d4','#a8eca8','#7de37d','#52c852','#3da63d','#288028'] },
  { name: '🔵蓝', hexes: ['#d4e8f5','#a8d1ec','#7dbae3','#52a0c8','#3d7ea6','#285c80'] },
  { name: '🔴红', hexes: ['#f5d4d4','#eca8a8','#e37d7d','#c85252','#a63d3d','#802828'] },
  { name: '🟡黄', hexes: ['#f5f0d4','#ece1a8','#e3d27d','#c8b852','#a6953d','#807228'] },
  { name: '🟣紫', hexes: ['#e8d4f5','#d1a8ec','#ba7de3','#a052c8','#7d3da6','#5c2880'] },
  { name: '🟠橙', hexes: ['#f5e0d4','#ecc8a8','#e3a87d','#c88052','#a6603d','#804428'] },
  { name: '🩷粉', hexes: ['#f5d4e8','#eca8d1','#e37dba','#c852a0','#a63d7d','#80285c'] },
  { name: '🟤棕', hexes: ['#f0e0d0','#e0c8a8','#c8a878','#a08058','#786040','#504028'] },
  { name: '⬜白', hexes: ['#ffffff','#f5f5f5','#e8e8e8','#d8d8d8','#c0c0c0','#a8a8a8'] },
  { name: '⬛黑', hexes: ['#666666','#555555','#444444','#333333','#222222','#111111'] },
  { name: '⚪灰', hexes: ['#f0f0f0','#d0d0d0','#b0b0b0','#909090','#707070','#505050'] },
  { name: '🩵青', hexes: ['#d4f5f0','#a8ece0','#7de3d0','#52c8b8','#3da695','#288072'] },
  { name: '🌿薄荷', hexes: ['#d4f5e0','#a8ecb8','#7de398','#52c878','#3da658','#288038'] },
  { name: '🌟金', hexes: ['#f5f0d4','#ece0a8','#e3d07d','#c8b052','#a6903d','#807028'] },
  { name: '👤肤色', hexes: ['#f5e8e0','#ecd8c8','#e3c8a8','#c8a888','#a08060','#806048'] },
];

// ===================== 现有皮肤 =====================
const BUILTIN_SKINS = [
{name:'紫晶史莱姆',px:['...........D....','..........DDD...','.....FFFFFFDDD..','...FFIJJHGGGDC..','..FGJKKIJHFGGC..','.FGHJKKIJFHFGFC.','.FHHHJJJHHFHGGC.','FFGHHHHHHHHHGGFC','FGGAHHBBBHAHHGGFC','FEEHHBBBHHHEEGFC','FFGGHHHHHHGGGFFC','CFFGGGGGGGGFFFFC','.CFFFFFFFFFFFFC.','..CCCCCCCCCCCCC.'],pal:{A:'#2f1f44',B:'#331c4a',C:'#321b4f',D:'#802828',E:'#a83b3f',F:'#7149a5',G:'#8f63b8',H:'#9f7fd3',I:'#d6b0e0',J:'#d8b1df',K:'#f4d4e2'}},
{name:'史莱姆王',px:['..C.C.C.C...','.CPCICICNC..','.EJPBBBBCNC.','.EENCMPPNCC.','.CMDDDDDDAC.','.DDKHHOOOKG.','FKKHHOLLLOHG','FKKHHOLLLOHG','FKKHHHOOOHHG','FKKKHHHHHHKG','.FFGGGGGGGG.'],pal:{A:'#391951',B:'#381955',C:'#533d20',D:'#003b82',E:'#8c142d',F:'#033caf',G:'#023eb0',H:'#005fc5',I:'#a18638',J:'#f03f31',K:'#4a4ecc',L:'#0195eb',M:'#feca01',N:'#ffca02',O:'#7487ed',P:'#fffeb3'}},
{name:'风史莱姆',px:['...A.....AAAAA.....A...','..AFA.AAACCCCCAAA.AFA..','..AHFACCCCCCCCCCCAFHA..','..AHFFACCCCCCCCCAFFHA..','..AAHHCCCCCCCCCCCFHAA..','.ACCACCBCCCCCCCBCCACCA.','.ACCCCBHBCCCCCBHBCCCCA.','ACCCCBHIHBCCCBHIHBCCCCA','ACCCCBHIHBCCCBHIHBCCCCA','ACFCFBHIHBGDGBHIHBFCFCA','AFCFCFBHBGDGDGBHBGCFCFA','AFFFFFFBFFFFFFFBFFFFFFA','AFFFFFFFFFFFFFFFFFFFFFA','.AFFFFFFFFFFFFFFFFFFFA.','..AEEEEEEEEEEEEEEFFFA..','...AAAAAAAAAAAAAAAAA...'],pal:{A:'#010103',B:'#3c98d2',C:'#48babb',D:'#48bcba',E:'#a1dde9',F:'#9fdfeb',G:'#a5ddec',H:'#a7e7e8',I:'#ffffff'}},
{name:'宝宝',px:['AA..............AA','ADA..AAAAAAA..ADA','AAA.ABBBBBBBA.AAA','...ABBBBBBBBBBA...','..ABBBCBBBCBBBA..','..AEBBCBBBCBEBA..','..AEBBBBBBBBBEA..','..ABBBBBBBBBBBA..','...ABBBBBBBBA....','....AAAAAAAAA....'],pal:{A:'#285c80',B:'#a8d1ec',C:'#ece1a8',D:'#d4e8f5',E:'#f0f0f0'}},
{name:'MC史莱姆',px:['BBBBBBBBBBBB','BEEEEEEEEDDB','BECCCCCCEDDB','BEAACCAAEDDB','BEAACCAAEDDB','BECCCCCCEDDB','BECCCACCEDDB','BECCCCCCEDDB','BEEEEEEEEDDB','BBBBBBBBBBBB'],pal:{A:'#080104',B:'#030309',C:'#1c9d47',D:'#15a44c',E:'#62c97c'}},
{name:'炫彩史莱姆',px:['.....CCCCC.....','...CCDDDDDCC...','..CDDDDDDDDDC..','.CDDDDDDDDDEDC.','CDDDDDDDDDDDDDC','CDDDDADDDADDEDC','CDDDDBDDDBDDEDC','CDDDDBDDDBDDEDC','CDDDDDDDDDDEDDC','.CCDDDDDDDDDCC.','..CCCCCCCCCC...'],pal:{A:'#020001',B:'#36134b',C:'#6fd2f2',D:'#bcecff',E:'#fbf9fc'}},
];

function renderSkinGallery() {
  const g = document.getElementById('skinGallery');
  g.innerHTML = '';
  BUILTIN_SKINS.forEach((skin, idx) => {
    const c = document.createElement('canvas');
    const s = 3; // cell size
    const w = skin.px[0].length * s;
    const h = skin.px.length * s;
    c.width = w; c.height = h;
    c.style.cssText = 'border:2px solid #444;border-radius:4px;cursor:pointer;image-rendering:pixelated;';
    c.title = skin.name + ' (点击加载)';
    const ctx = c.getContext('2d');
    for (let r = 0; r < skin.px.length; r++) {
      for (let col = 0; col < skin.px[r].length; col++) {
        const ch = skin.px[r][col];
        if (ch !== '.' && skin.pal[ch]) {
          ctx.fillStyle = skin.pal[ch];
          ctx.fillRect(col*s, r*s, s, s);
        }
      }
    }
    c.addEventListener('click', () => {
      // Load this skin into the editor
      const pxData = skin.px;
      const w2 = pxData[0].length, h2 = pxData.length;
      document.getElementById('gridSize').value = Math.max(w2, h2);
      resizeGrid(Math.max(w2, h2));
      for (let r = 0; r < h2; r++) {
        for (let col = 0; col < w2; col++) {
          const ch = pxData[r][col];
          grid[r][col] = (ch !== '.' && skin.pal[ch]) ? skin.pal[ch] : null;
        }
      }
      drawGrid();
    });
    g.appendChild(c);
  });
}

// ===================== 状态 =====================
let grid = Array.from({length: GRID_H}, () => Array(GRID_W).fill(null));
let currentColor = '#52c852';
let isEraser = false;
let undoStack = [];

function isMobile() { return /Mobi|Android/i.test(navigator.userAgent); }

// ===================== DOM =====================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width  = GRID_W * CELL_SIZE;
canvas.height = GRID_H * CELL_SIZE;

// ===================== 色板渲染 =====================
const paletteDiv = document.getElementById('palette');
COLOR_FAMILIES.forEach(fam => {
  const row = document.createElement('div');
  row.className = 'color-row';

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = fam.name;
  row.appendChild(label);

  fam.hexes.forEach(hex => {
    const cell = document.createElement('div');
    cell.className = 'color-cell';
    cell.style.background = hex;
    cell.title = hex;
    if (hex === currentColor) cell.classList.add('active');
    cell.addEventListener('click', (e) => {
      e.stopPropagation();
      isEraser = false;
      currentColor = hex;
      updateSwatch();
      document.querySelectorAll('.color-cell').forEach(c => c.classList.remove('active'));
      cell.classList.add('active');
    });
    row.appendChild(cell);
  });

  paletteDiv.appendChild(row);
});

// ===================== 画布渲染 =====================
function drawGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < GRID_H; r++) {
    for (let c = 0; c < GRID_W; c++) {
      const x = c * CELL_SIZE, y = r * CELL_SIZE;
      if (grid[r][c]) {
        ctx.fillStyle = grid[r][c];
        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
      } else {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#3a3a3a' : '#444';
        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
      }
    }
  }
  // 网格线
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  for (let r = 0; r <= GRID_H; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * CELL_SIZE); ctx.lineTo(GRID_W * CELL_SIZE, r * CELL_SIZE); ctx.stroke();
  }
  for (let c = 0; c <= GRID_W; c++) {
    ctx.beginPath(); ctx.moveTo(c * CELL_SIZE, 0); ctx.lineTo(c * CELL_SIZE, GRID_H * CELL_SIZE); ctx.stroke();
  }
}

function pickCustom(hex) {
  isEraser = false; currentColor = hex;
  document.querySelectorAll('.color-cell').forEach(c => c.classList.remove('active'));
  updateSwatch();
}

function updateSwatch() {
  document.getElementById('swatch').style.background = isEraser ? '#555' : currentColor;
  document.getElementById('hexLabel').textContent = isEraser ? '橡皮擦' : currentColor;
  document.getElementById('customColor').value = isEraser ? '#555555' : currentColor;
}

function setEraser() {
  isEraser = !isEraser;
  document.querySelectorAll('.color-cell').forEach(c => c.classList.remove('active'));
  updateSwatch();
}

// ===================== 交互 =====================
function getCell(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  const c = Math.floor(x / CELL_SIZE);
  const r = Math.floor(y / CELL_SIZE);
  return { r, c };
}

function paint(r, c, isErase) {
  if (r < 0 || r >= GRID_H || c < 0 || c >= GRID_W) return;
  const old = grid[r][c];
  const val = isErase ? null : currentColor;
  if (old === val) return;
  undoStack.push({ r, c, old });
  if (undoStack.length > 500) undoStack.shift();
  grid[r][c] = val;
  drawGrid();
}

function undo() {
  if (undoStack.length === 0) return;
  const steps = [undoStack.pop()];
  // 一次撤销连续的同色操作
  while (undoStack.length > 0) {
    const prev = undoStack[undoStack.length - 1];
    if (prev.r === steps[0].r && prev.c === steps[0].c) steps.push(undoStack.pop());
    else break;
  }
  steps.forEach(s => { grid[s.r][s.c] = s.old; });
  drawGrid();
}

function clearAll() {
  if (confirm('确定清空画布？')) {
    grid = Array.from({length: GRID_H}, () => Array(GRID_W).fill(null));
    undoStack = [];
    drawGrid();
  }
}

// ===================== 画布大小 =====================
function resizeGrid(val) {
  const s = parseInt(val);
  document.getElementById('gridSizeLabel').textContent = s + '×' + s;
  // 保留旧数据
  const old = grid;
  grid = Array.from({length: s}, () => Array(s).fill(null));
  const copyH = Math.min(s, old.length);
  const copyW = Math.min(s, old[0]?.length || 0);
  for (let r = 0; r < copyH; r++)
    for (let c = 0; c < copyW; c++)
      grid[r][c] = old[r][c];
  // 更新全局变量
  GRID_H = s; GRID_W = s;
  canvas.width = s * CELL_SIZE; canvas.height = s * CELL_SIZE;
  undoStack = [];
  drawGrid();
}

// ===================== 导入 =====================
function showImport() {
  document.getElementById('importOverlay').classList.add('show');
}

function closeImport(e) {
  if (e && e.target !== document.getElementById('importOverlay')) return;
  document.getElementById('importOverlay').classList.remove('show');
}

function doImport() {
  let code = document.getElementById('importCode').value.trim();
  if (!code) { alert('请粘贴代码！'); return; }
  try {
    // 预处理：去掉行尾注释（注意保留 hex 颜色码）、统一换行和引号
    code = code.split('\n').map(line => {
      // 只在引号外的 # 才算注释
      const quoteIdx = line.lastIndexOf('"');
      const hashIdx = line.indexOf('#');
      if (hashIdx > -1 && hashIdx > quoteIdx) return line.substring(0, hashIdx);
      return line;
    }).join('\n');
    code = code.replace(/\\n/g, '\n').replace(/\\r/g, '');
    code = code.replace(/'/g, '"'); // 统一引号

    // 找 PALETTE 块
    const pStart = code.indexOf('PALETTE');
    const pEnd = code.indexOf('}', code.indexOf('{', pStart));
    if (pStart < 0 || pEnd < 0) throw new Error('找不到 PALETTE 块');

    // 找 SLIME_PX 块
    const sStart = code.indexOf('SLIME_PX');
    const sEnd = code.indexOf(']', sStart);
    if (sStart < 0 || sEnd < 0) throw new Error('找不到 SLIME_PX 块');

    // 解析颜色：支持 QColor(r,g,b) 和 hex #rrggbb 两种格式
    const letterMap = {};
    const paletteBlock = code.substring(pStart, pEnd + 1);
    // 匹配: "X": QColor(r, g, b)
    const qcRe = /"(\w+)"\s*:\s*QColor\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/g;
    let m;
    while ((m = qcRe.exec(paletteBlock)) !== null) {
      letterMap[m[1]] = '#' + parseInt(m[2]).toString(16).padStart(2,'0')
                            + parseInt(m[3]).toString(16).padStart(2,'0')
                            + parseInt(m[4]).toString(16).padStart(2,'0');
    }
    // 也支持 "X": "#rrggbb" 格式
    const hexRe = /"(\w+)"\s*:\s*"#([0-9a-fA-F]{6})"/g;
    while ((m = hexRe.exec(paletteBlock)) !== null) {
      letterMap[m[1]] = '#' + m[2].toLowerCase();
    }

    if (Object.keys(letterMap).length === 0) throw new Error('没解析到任何颜色');

    // 解析点阵：找到所有引号包裹的行
    const pxBlock = code.substring(sStart, sEnd + 1);
    const rowRe = /"([^"]+)"/g;
    const rows = [];
    let rm;
    while ((rm = rowRe.exec(pxBlock)) !== null) {
      rows.push(rm[1]);
    }

    if (rows.length === 0) throw new Error('没解析到任何像素行');

    const h = rows.length, w = rows[0].length;
    document.getElementById('gridSize').value = Math.max(w, h);
    resizeGrid(Math.max(w, h));

    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        const ch = rows[r][c];
        if (ch === '.') grid[r][c] = null;
        else if (letterMap[ch]) grid[r][c] = letterMap[ch];
      }
    }

    drawGrid();
    closeImport();
    document.getElementById('importCode').value = '';
    alert('导入成功！' + w + '×' + h + ', ' + Object.keys(letterMap).length + '种颜色');
  } catch(e) {
    alert('解析失败: ' + e.message + '\n\n支持格式:\nPALETTE = { "X": QColor(r,g,b), ... }\nSLIME_PX = [ "..X..", ... ]\n\n注意: 必须包含 PALETTE 和 SLIME_PX 两个关键字');
  }
}

// ===================== 笔触光标 (手机) =====================
const penDot = document.getElementById('penDot');
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    penDot.style.display = 'block';
    penDot.style.left = e.touches[0].clientX + 'px';
    penDot.style.top = e.touches[0].clientY + 'px';
  }
}, {passive: true});

canvas.addEventListener('touchend', () => {
  penDot.style.display = 'none';
});

canvas.addEventListener('touchcancel', () => {
  penDot.style.display = 'none';
});

// 鼠标事件
let mouseDown = false;
let lastR = -1, lastC = -1;

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) { mouseDown = true; const {r,c} = getCell(e); paint(r, c, isEraser); lastR=r; lastC=c; }
  if (e.button === 2) { const {r,c} = getCell(e); paint(r, c, true); }
  e.preventDefault();
});

canvas.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  const {r,c} = getCell(e);
  if (r !== lastR || c !== lastC) { paint(r, c, isEraser); lastR=r; lastC=c; }
});

canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// 触摸事件（手机）
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const {r,c} = getCell(e.touches[0]);
    const longPress = false;
    paint(r, c, isEraser);
    lastR=r; lastC=c;
  }
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const {r,c} = getCell(e.touches[0]);
    if (r !== lastR || c !== lastC) { paint(r, c, isEraser); lastR=r; lastC=c; }
  }
});

canvas.addEventListener('touchend', () => { lastR=-1; lastC=-1; });

// 双指缩放（手机）
let pinchDist0 = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinchDist0 = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, {passive: true});

canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (pinchDist0 > 0 && Math.abs(d - pinchDist0) > 10) {
      CELL_SIZE = Math.max(8, Math.min(40, CELL_SIZE * d / pinchDist0));
      canvas.width  = GRID_W * CELL_SIZE;
      canvas.height = GRID_H * CELL_SIZE;
      drawGrid();
      pinchDist0 = d;
    }
  }
}, {passive: true});

canvas.addEventListener('touchend', () => { pinchDist0 = 0; });

// ===================== 导出 =====================
function exportCode() {
  // 裁剪空白边
  let minR = GRID_H, maxR = 0, minC = GRID_W, maxC = 0;
  for (let r = 0; r < GRID_H; r++) {
    for (let c = 0; c < GRID_W; c++) {
      if (grid[r][c]) {
        minR = Math.min(minR, r); maxR = Math.max(maxR, r);
        minC = Math.min(minC, c); maxC = Math.max(maxC, c);
      }
    }
  }
  if (minR > maxR) { alert('先画点什么再导出！'); return; }

  // 收集颜色 → 分配字母
  const unique = new Set();
  for (let r = minR; r <= maxR; r++)
    for (let c = minC; c <= maxC; c++)
      if (grid[r][c]) unique.add(grid[r][c]);

  const sorted = [...unique].sort((a,b) => {
    const [ra,ga,ba] = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
    const [rb,gb,bb] = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
    return (ra+ga+ba) - (rb+gb+bb);
  });

  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  const colorMap = {};
  sorted.forEach((hex, i) => { colorMap[hex] = letters[i] || `X${i}`; });

  // 生成 PALETTE
  let paletteStr = 'PALETTE = {\n';
  sorted.forEach(hex => {
    const letter = colorMap[hex];
    const [r,g,b] = [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
    paletteStr += `    '${letter}': QColor(${r}, ${g}, ${b}),   # ${hex}\n`;
  });
  paletteStr += '}';

  // 生成点阵
  let pxStr = 'SLIME_PX = [\n';
  for (let r = minR; r <= maxR; r++) {
    let row = '';
    for (let c = minC; c <= maxC; c++) {
      row += grid[r][c] ? colorMap[grid[r][c]] : '.';
    }
    pxStr += `    "${row}",\n`;
  }
  pxStr += ']';

  const code = paletteStr + '\n\n' + pxStr;
  const w = maxC - minC + 1, h = maxR - minR + 1;

  document.getElementById('exportInfo').textContent =
    `尺寸: ${w}×${h} | 颜色: ${unique.size} 种 | 直接复制粘贴到 pet.py`;
  document.getElementById('exportCode').textContent = code;
  document.getElementById('modalOverlay').classList.add('show');
}

function copyCode() {
  const code = document.getElementById('exportCode').textContent;
  navigator.clipboard.writeText(code).then(() => alert('已复制到剪贴板！'));
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
}

// ===================== 初始化 =====================
updateSwatch();
drawGrid();
renderSkinGallery();
</script>
